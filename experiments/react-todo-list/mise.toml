# Local toolchain for this experiment. Run `mise install` after checkout,
# then drive everything through `mise run <task>`.
[tools]
node = "22"

[tasks.install]
description = "Install npm dependencies"
run = "npm install"

[tasks.dev]
description = "Start the Vite dev server"
run = "npm run dev"

[tasks.build]
description = "Type-check and build for production"
run = "npm run build"

[tasks.lint]
description = "Lint with oxlint"
run = "npm run lint"

[tasks.test]
description = "Run unit tests with vitest"
run = "npm test"

[tasks.verify]
description = "Run lint, tests, and build in sequence"
depends = ["lint", "test", "build"]
